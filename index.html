<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gestor de tareas con categorías, búsqueda y filtros. Tus datos se guardan en este navegador.">
  <title>Gestor de tareas</title>

  <!-- Aplica el tema guardado antes de pintar para evitar un destello -->
  <script>
    try {
      var guardado = localStorage.getItem('gestor-tareas:tema');
      var oscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-tema', guardado || (oscuro ? 'oscuro' : 'claro'));
    } catch (e) {
      document.documentElement.setAttribute('data-tema', 'claro');
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="pagina">

    <header class="barra">
      <p class="marca">Gestor de tareas</p>
      <button type="button" id="btn-tema" class="btn-icono" aria-label="Cambiar a tema oscuro"></button>
    </header>

    <section class="hero" aria-labelledby="hero-estado">
      <p id="hero-fecha" class="hero-fecha"></p>
      <h1 id="hero-estado" class="hero-estado">Cargando…</h1>
      <p id="hero-detalle" class="hero-detalle"></p>

      <div id="segmentos" class="segmentos" role="img" aria-label="Progreso de tareas"></div>

      <div class="hero-pie">
        <nav id="tabs" class="tabs" aria-label="Filtrar por estado">
          <button type="button" data-estado="todas" aria-pressed="true">Todas <span class="n" id="n-todas">0</span></button>
          <button type="button" data-estado="pendientes" aria-pressed="false">Pendientes <span class="n" id="n-pendientes">0</span></button>
          <button type="button" data-estado="completadas" aria-pressed="false">Completadas <span class="n" id="n-completadas">0</span></button>
          <button type="button" data-estado="vencidas" aria-pressed="false">Vencidas <span class="n" id="n-vencidas">0</span></button>
        </nav>
        <button type="button" id="btn-nueva" class="btn btn-primario">Nueva tarea</button>
      </div>
    </section>

    <main class="cuerpo">
      <section class="lista-zona" aria-labelledby="titulo-lista">
        <h2 id="titulo-lista" class="solo-lectores">Lista de tareas</h2>

        <div class="herramientas" role="search">
          <div class="busqueda">
            <label for="buscar" class="solo-lectores">Buscar tareas</label>
            <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="buscar" type="search" placeholder="Buscar por título o descripción" autocomplete="off">
          </div>

          <div class="selectores">
            <div class="mini-campo">
              <label for="f-prioridad">Prioridad</label>
              <select id="f-prioridad">
                <option value="todas">Todas</option>
                <option value="alta">Alta</option>
                <option value="media">Media</option>
                <option value="baja">Baja</option>
              </select>
            </div>
            <div class="mini-campo">
              <label for="f-orden">Ordenar por</label>
              <select id="f-orden">
                <option value="creacion">Más recientes</option>
                <option value="fecha">Fecha límite</option>
                <option value="prioridad">Prioridad</option>
                <option value="titulo">Título (A-Z)</option>
              </select>
            </div>
          </div>
        </div>

        <div id="chips" class="chips" role="group" aria-label="Filtrar por categoría"></div>

        <p id="resultado" class="resultado" aria-live="polite"></p>
        <ul id="lista" class="lista"></ul>

        <div class="lista-pie">
          <button type="button" id="btn-limpiar" class="btn btn-borrar">Eliminar completadas</button>
        </div>
      </section>

      <aside class="panel" aria-labelledby="titulo-form">
        <h2 id="titulo-form">Nueva tarea</h2>

        <form id="form-tarea" novalidate>
          <div class="campo">
            <label for="titulo">Título</label>
            <input id="titulo" name="titulo" type="text" maxlength="80" autocomplete="off" required>
          </div>

          <div class="campo">
            <label for="descripcion">Descripción <span class="opcional">(opcional)</span></label>
            <textarea id="descripcion" name="descripcion" rows="3" maxlength="300"></textarea>
          </div>

          <div class="campo">
            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria"></select>
          </div>

          <div class="fila">
            <div class="campo">
              <label for="prioridad">Prioridad</label>
              <select id="prioridad" name="prioridad">
                <option value="alta">Alta</option>
                <option value="media" selected>Media</option>
                <option value="baja">Baja</option>
              </select>
            </div>
            <div class="campo">
              <label for="fecha">Fecha límite</label>
              <input id="fecha" name="fecha" type="date">
            </div>
          </div>

          <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

          <div class="acciones">
            <button type="submit" id="btn-guardar" class="btn btn-primario">Agregar tarea</button>
            <button type="button" id="btn-cancelar" class="btn" hidden>Cancelar edición</button>
          </div>
        </form>

        <form id="form-categoria" class="nueva-categoria" novalidate>
          <label for="nueva-categoria">Crear categoría</label>
          <div class="fila-simple">
            <input id="nueva-categoria" type="text" maxlength="20" autocomplete="off" placeholder="Ej. Salud">
            <button type="submit" class="btn">Crear</button>
          </div>
        </form>
      </aside>
    </main>

    <footer class="pie">
      <p>Laboratorio de Programación Web. Hecho con JavaScript y localStorage.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
